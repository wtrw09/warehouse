# CNB 云原生构建流水线配置
# 推送至 main 分支时，并行构建前后端多架构镜像并推送到 CNB Docker 制品库
# 镜像地址：
#   docker.cnb.cool/wtrw09/warehouse/warehouse-frontend:latest
#   docker.cnb.cool/wtrw09/warehouse/warehouse-backend:latest
#   docker.cnb.cool/wtrw09/warehouse/redis:7.2-alpine

main:
  push:
    # 流水线1：构建前端镜像（amd64 + arm64 多架构 manifest）
    - name: build-frontend
      services:
        - name: docker
          options:
            rootlessBuildkitd:
              enabled: true
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: build and push frontend
          script: |
            docker buildx build \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/warehouse-frontend:latest \
              --platform linux/amd64,linux/arm64 \
              --push \
              -f frontend/Dockerfile \
              frontend/

    # 流水线2：构建后端镜像（amd64 + arm64 多架构 manifest）
    - name: build-backend
      services:
        - name: docker
          options:
            rootlessBuildkitd:
              enabled: true
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: build and push backend
          script: |
            docker buildx build \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/warehouse-backend:latest \
              --platform linux/amd64,linux/arm64 \
              --push \
              -f backend/Dockerfile \
              backend/

    # 流水线3：转发 Redis 官方多架构镜像到 CNB 制品库（方便国内用户拉取）
    # 注意：不使用 imagetools create（并发推送触发 429 限流），改为逐平台 pull+push
    - name: push-redis
      services:
        - name: docker
          options:
            rootlessBuildkitd:
              enabled: true
      stages:
        - name: retag and push redis
          script: |
            docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
            TARGET=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:7.2-alpine

            # 逐平台拉取、标记、推送（避免 imagetools 并发限流）
            for PLATFORM in linux/amd64 linux/arm64; do
              TAG=$(echo $PLATFORM | tr '/' '-')
              echo "--- Processing $PLATFORM ---"
              docker pull --platform $PLATFORM redis:7.2-alpine
              docker tag redis:7.2-alpine ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:${TAG}
              docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:${TAG}
              sleep 5
            done

            # 创建多架构 manifest list
            echo "--- Creating multi-arch manifest ---"
            docker manifest create $TARGET \
              ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:linux-amd64 \
              ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:linux-arm64
            docker manifest annotate $TARGET \
              ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:linux-amd64 \
              --arch amd64 --os linux
            docker manifest annotate $TARGET \
              ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/redis:linux-arm64 \
              --arch arm64 --os linux
            docker manifest push $TARGET
            echo "Success: redis multi-arch image pushed to CNB"
